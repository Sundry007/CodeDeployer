<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">CodeDeployer logo</title>
  <desc id="desc">CodeDeployer wordmark with a code-to-server deploy icon.</desc>
  <defs>
    <linearGradient id="bg" x1="54" y1="48" x2="282" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.58" stop-color="#0b4f54"/>
      <stop offset="1" stop-color="#17313a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="112" y1="176" x2="228" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#052e2b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
