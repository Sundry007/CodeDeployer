    <path d="M135 119 94 160l41 41" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 124 143 197" fill="none" stroke="#a7f3d0" stroke-width="15" stroke-linecap="round"/>
    <path d="M111 174c28 12 57 10 85-6 20-11 35-27 52-44" fill="none" stroke="url(#arrow)" stroke-width="17" stroke-linecap="round"/>
    <path d="M247 125 243 161 276 147Z" fill="#fb923c"/>
    <rect x="222" y="102" width="52" height="31" rx="9" fill="#f8fafc"/>
    <rect x="222" y="149" width="52" height="31" rx="9" fill="#f8fafc"/>
    <rect x="222" y="196" width="52" height="31" rx="9" fill="#f8fafc"/>
    <circle cx="236" cy="117" r="4.5" fill="#14b8a6"/>
    <circle cx="236" cy="164" r="4.5" fill="#14b8a6"/>
    <circle cx="236" cy="211" r="4.5" fill="#14b8a6"/>
    <path d="M247 117h16M247 164h16M247 211h16" stroke="#17313a" stroke-width="5.5" stroke-linecap="round" opacity="0.64"/>
